version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: libroloop-postgres
    environment:
      POSTGRES_DB: libroloop
      POSTGRES_USER: libroloop
      POSTGRES_PASSWORD: libroloop123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U libroloop -d libroloop"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
